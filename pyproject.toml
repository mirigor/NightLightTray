[tool.ruff]
target-version = "py310"
line-length = 100
force-exclude = true
extend-exclude = [".toolchains", ".smoke", "build", "build-*", "dist", "dist-*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# В тестах платформа Qt выбирается до импорта PySide6
"tests/*.py" = ["E402"]
# Диагностический скрипт сначала добавляет корень проекта в sys.path
"tools/check_wnl.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
